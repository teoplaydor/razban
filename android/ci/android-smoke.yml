name: android-smoke

# Diagnostic: installs the app in an emulator, grants VPN consent (as the user
# would), launches the WebView UI, and dumps logcat — so we can SEE what
# actually happens at runtime (VPN connect, bundles.health, update check)
# instead of guessing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SING_BOX_TAG: v1.13.12
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with: { go-version: '1.24.7' }
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK 28 + SDK
        run: |
          yes | sdkmanager "ndk;28.0.13004108" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Inject bundled default config
        run: |
          if [ -n "${{ secrets.DEFAULT_CONFIG_GZ_B64 }}" ]; then
            mkdir -p android/app/src/main/assets
            echo "${{ secrets.DEFAULT_CONFIG_GZ_B64 }}" | base64 -d | gunzip > android/app/src/main/assets/default-config.json
          fi
      - name: Build libbox.aar
        run: bash android/build-libbox.sh "$SING_BOX_TAG"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Smoke test in emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: |
            adb wait-for-device
            adb logcat -c || true
            gradle :app:installDebug --no-daemon --stacktrace
            PKG=com.razban.app.debug
            adb shell appops set $PKG ACTIVATE_VPN allow || true
            adb shell appops set $PKG REQUEST_INSTALL_PACKAGES allow || true
            adb logcat -v threadtime > "$GITHUB_WORKSPACE/android/smoke-logcat.txt" 2>&1 &
            LP=$!
            adb shell am start -n $PKG/com.razban.app.ui.WebUiActivity
            sleep 35
            kill $LP 2>/dev/null || true
            echo "logcat bytes: $(wc -c < "$GITHUB_WORKSPACE/android/smoke-logcat.txt")"
      - name: Dump key logcat
        if: always()
        run: |
          F="$GITHUB_WORKSPACE/android/smoke-logcat.txt"
          echo "===== razban-core / bridge / update ====="
          grep -aE "razban-core|razban-bridge|razban-update" "$F" | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ //' | head -120 || echo none
          echo "===== WebView console (UI side) ====="
          grep -aiE "chromium.*CONSOLE|razban" "$F" | grep -aiE "CONSOLE" | head -40 || echo none
          echo "===== Go panic / crash ====="
          grep -aE "Go      : panic|Fatal signal|AndroidRuntime.*FATAL" "$F" | head -20 || echo none
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: smoke-logcat, path: android/smoke-logcat.txt }
