    <!-- Polyfills for old Android System WebViews (down to Chrome 51 / API 24).

         dist is shared with the desktop, so old phones hit them. This classic
         script runs BEFORE the deferred module bundle (framer-motion calls
         queueMicrotask at import time → ReferenceError without this). -->

      (function () {
        if (typeof window.queueMicrotask !== 'function') {
          window.queueMicrotask = function (cb) {
            Promise.resolve().then(cb).catch(function (e) {
              setTimeout(function () { throw e; }, 0);
            });
          };
        }
        if (typeof window.globalThis === 'undefined') {
          try { window.globalThis = window; } catch (e) {}
        }
      })();
