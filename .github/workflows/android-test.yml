name: android-test

# Boots a real Android emulator on CI and runs the VPN-flow instrumented test
# (VpnFlowTest): it brings the tunnel up with a direct config and a proxy
# config, generating traffic for each. A SOCKS logger on the runner host acts
# as the fake "VPN exit" — afterwards we assert it saw the proxy-flow domain
# (example.net) and NOT the direct-flow domain (example.org). That proves both
# routing paths end-to-end on a device.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    env:
      SING_BOX_TAG: v1.13.12
      SOCKS_LOG: /tmp/socks.log
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 28 + SDK platform/build-tools
        run: |
          yes | sdkmanager "ndk;28.0.13004108" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Build libbox.aar
        run: bash android/build-libbox.sh "$SING_BOX_TAG"

      - name: Start SOCKS logger (fake VPN exit)
        run: |
          nohup python3 android/ci/socks-logger.py > /tmp/socks-stdout.log 2>&1 &
          sleep 2
          cat /tmp/socks-stdout.log || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run VPN-flow test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: |
            adb wait-for-device
            adb logcat -c || true
            set +e
            # Stream logcat to a file from the START (survives a script abort,
            # captures a native crash that a post-hoc `logcat -d` would miss).
            adb logcat -v threadtime > "$GITHUB_WORKSPACE/logcat-full.txt" 2>&1 &
            LOGCAT_PID=$!
            # Run the instrumented VPN-flow test (it self-grants ACTIVATE_VPN).
            gradle connectedDebugAndroidTest --no-daemon --stacktrace
            rc=$?
            sleep 3
            kill "$LOGCAT_PID" 2>/dev/null
            echo "rc=$rc; logcat bytes: $(wc -c < "$GITHUB_WORKSPACE/logcat-full.txt" 2>/dev/null)"
            exit $rc

      - name: Dump crash logcat
        if: always()
        run: |
          echo "===== razban / runtime / native crash lines ====="
          grep -aE "razban-core|AndroidRuntime|FATAL|--------- beginning of crash|libc :|DEBUG   :|GoLog|panic:|signal [0-9]+|SIGSEGV|SIGABRT|nekohasekai|libbox|VpnService|RazbanVpnService|Exception|tombstone" "$GITHUB_WORKSPACE/logcat-full.txt" | head -120 || echo "(no logcat-full.txt or no matches)"
          echo "===== END ====="

      - name: Show SOCKS log + assert routing
        if: always()
        run: |
          echo "=== SOCKS exit log ==="
          cat "$SOCKS_LOG" || echo "(empty)"
          echo "======================"
          if grep -q "example.net" "$SOCKS_LOG"; then
            echo "PASS: proxy flow tunneled example.net through the SOCKS exit"
          else
            echo "FAIL: proxy flow did NOT reach the SOCKS exit"; exit 1
          fi
          if grep -q "example.org" "$SOCKS_LOG"; then
            echo "FAIL: direct flow leaked into the proxy (example.org seen at exit)"; exit 1
          else
            echo "PASS: direct flow did NOT pass through the proxy (egressed directly)"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/androidTests/
            android/logcat-full.txt
            android/logcat-crash.txt
            /tmp/socks.log
