name: android-emulator-ui

# Visual + functional UI test on a real Android emulator. Installs the app with
# the REAL bundled config (so it actually connects to the VPS), lets it
# auto-connect, then drives the WebView UI over CDP: tours every screen
# (Маршрутизация/Серверы/Статы/Настройки/About), screenshots each, and dumps
# innerText (catches React crashes / blank screens). Verifies the tunnel
# reaches Started and that live throughput is wired. Uploads screenshots +
# a montage + logcat so we can SEE how it looks on the phone.

on:
  push:
    branches: [ "ci/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    env:
      SING_BOX_TAG: v1.13.12
      PKG: com.razban.app.debug
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with: { go-version: '1.24.7' }
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK 28 + SDK
        run: |
          yes | sdkmanager "ndk;28.0.13004108" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Install CDP driver deps
        run: python3 -m pip install --quiet "websockets>=11,<13"
      - name: Inject bundled default config (real VPS bundle)
        run: |
          if [ -n "${{ secrets.DEFAULT_CONFIG_GZ_B64 }}" ]; then
            mkdir -p android/app/src/main/assets
            echo "${{ secrets.DEFAULT_CONFIG_GZ_B64 }}" | base64 -d | gunzip > android/app/src/main/assets/default-config.json
            echo "default-config.json injected ($(wc -c < android/app/src/main/assets/default-config.json) bytes)"
          else
            echo "NO DEFAULT_CONFIG_GZ_B64 secret — app will boot with 0 servers (UI still testable)"
          fi
      - name: Build libbox.aar
        run: bash android/build-libbox.sh "$SING_BOX_TAG"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: UI tour in emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: |
            set +e
            SHOTS="$GITHUB_WORKSPACE/android/shots"
            mkdir -p "$SHOTS"
            adb wait-for-device
            adb logcat -c || true
            adb logcat -v threadtime > "$GITHUB_WORKSPACE/android/ui-logcat.txt" 2>&1 &
            LP=$!

            echo "::group::install"
            gradle :app:installDebug --no-daemon --stacktrace
            echo "::endgroup::"

            # Pre-grant everything the app would otherwise prompt for, so the
            # 1.2s auto-connect goes through silently and the notification shows.
            adb shell appops set $PKG ACTIVATE_VPN allow || true
            adb shell appops set $PKG REQUEST_INSTALL_PACKAGES allow || true
            adb shell pm grant $PKG android.permission.POST_NOTIFICATIONS || true

            # Launch the WebView UI activity directly.
            adb shell am start -n $PKG/com.razban.app.ui.WebUiActivity
            sleep 6
            adb exec-out screencap -p > "$SHOTS/00-launch.png"

            # ── Forward the WebView devtools unix socket for CDP (+ diagnostics) ──
            echo "::group::cdp-setup"
            SOCK=""
            for i in $(seq 1 30); do
              SOCK=$(adb shell cat /proc/net/unix 2>/dev/null | grep -aoE 'webview_devtools_remote_[0-9]+' | head -1)
              [ -n "$SOCK" ] && break
              sleep 1
            done
            echo "devtools socket: '$SOCK'"
            python3 -c "import websockets; print('websockets', websockets.__version__)" || echo "WEBSOCKETS IMPORT FAILED"
            if [ -n "$SOCK" ]; then
              adb forward tcp:9222 localabstract:$SOCK && echo "forwarded 9222 -> $SOCK"
              python3 -c "import urllib.request,json; print('targets:', json.dumps(json.load(urllib.request.urlopen('http://127.0.0.1:9222/json',timeout=8)))[:500])" || echo "JSON ENDPOINT FAILED"
            else
              echo "NO devtools socket — CDP nav unavailable (will screencap home only)"
            fi
            echo "::endgroup::"

            # Poll up to ~60s for the tunnel to reach connected (auto-connect).
            echo "::group::connect-poll"
            CONNECTED=0
            for i in $(seq 1 30); do
              ST=$(python3 ci/cdp-eval.py "(document.body.innerText.match(/Подключено|Подключение|Отключено|Ошибка|Нет конфиг/)||['?'])[0]" 2>/dev/null | tail -1)
              echo "ui-status[$i]: $ST"
              if echo "$ST" | grep -q "Подключено"; then CONNECTED=1; break; fi
              sleep 2
            done
            echo "CONNECTED=$CONNECTED"
            python3 ci/cdp-eval.py "JSON.stringify({status:(document.body.innerText.match(/Подключено|Подключение|Отключено/)||[''])[0], hasSpeed:/КБ\/с|МБ\/с|Б\/с/.test(document.body.innerText), servers:(document.body.innerText.match(/VLESS|Reality|Hysteria|AnyTLS|ShadowTLS/gi)||[]).length})" || true
            echo "::endgroup::"

            adb exec-out screencap -p > "$SHOTS/00b-after-connect.png"

            # ── Tour every route: CDP sets the hash, screencap grabs the device frame ──
            echo "::group::ui-tour"
            for r in home:01 servers:02 stats:03 settings:04 about:05; do
              route="/${r%%:*}"; n="${r##*:}"
              echo "--- nav $route ---"
              python3 ci/cdp-eval.py "location.hash='#$route'; location.hash" 2>/dev/null | tail -1
              sleep 3
              adb exec-out screencap -p > "$SHOTS/${n}-${r%%:*}.png"
              echo "### $route innerText (first 400):"
              python3 ci/cdp-eval.py "((document.querySelector('#root')||document.body).innerText||'(empty)').replace(/\s+/g,' ').slice(0,400)" 2>/dev/null
            done
            echo "::endgroup::"

            kill $LP 2>/dev/null || true
            echo "shots:"; ls -la "$SHOTS/"
            exit 0
      - name: Montage screenshots
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/android/shots" || exit 0
          if ls *.png >/dev/null 2>&1; then
            montage $(ls *.png | sort) -tile 4x -geometry 270x+8+8 -background '#0b0b0f' \
              "$GITHUB_WORKSPACE/android/ui-montage.png" || echo "montage failed"
          fi
      - name: Key logcat
        if: always()
        run: |
          F="$GITHUB_WORKSPACE/android/ui-logcat.txt"
          echo "===== razban core/bridge/update ====="
          grep -aE "razban-core|razban-bridge|razban-update|RazbanVpn|CoreStatus" "$F" 2>/dev/null | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ //' | head -120 || echo none
          echo "===== Go panic / native crash ====="
          grep -aE "Go      : panic|Fatal signal|AndroidRuntime.*FATAL|SIGSEGV|SIGABRT" "$F" 2>/dev/null | head -20 || echo none
          echo "===== WebView console ====="
          grep -aiE "chromium.*CONSOLE" "$F" 2>/dev/null | head -40 || echo none
      - name: Upload screenshots + montage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            android/shots/
            android/ui-montage.png
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: ui-logcat, path: android/ui-logcat.txt }
