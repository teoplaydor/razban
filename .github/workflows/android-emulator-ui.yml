name: android-emulator-ui

# Visual + functional UI test on a real Android emulator. Installs the app with
# the REAL bundled config (so it actually connects to the VPS), lets it
# auto-connect, then drives the WebView UI over CDP: tours every screen
# (Маршрутизация/Серверы/Статы/Настройки/About), screenshots each, and dumps
# innerText (catches React crashes / blank screens). Verifies the tunnel
# reaches Started and that live throughput is wired. Uploads screenshots +
# a montage + logcat so we can SEE how it looks on the phone.

on:
  push:
    branches: [ "ci/**" ]
    paths-ignore:
      - 'android/ci/desktop-shot.js'
      - '.github/workflows/desktop-ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Span the real device floor → ceiling. API 24 (Android 7) ships the
        # oldest System WebView (~Chrome 51) — the harshest compat test (this is
        # where crypto.randomUUID-class API gaps and es2020 parse failures bite).
        api-level: [24, 29, 34]
    env:
      SING_BOX_TAG: v1.13.12
      PKG: com.razban.app.debug
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with: { go-version: '1.24.7' }
      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK 28 + SDK
        run: |
          yes | sdkmanager "ndk;28.0.13004108" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Install CDP driver deps
        run: python3 -m pip install --quiet "websockets>=11,<13"
      - name: Inject bundled default config (real VPS bundle)
        run: |
          if [ -n "${{ secrets.DEFAULT_CONFIG_GZ_B64 }}" ]; then
            mkdir -p android/app/src/main/assets
            echo "${{ secrets.DEFAULT_CONFIG_GZ_B64 }}" | base64 -d | gunzip > android/app/src/main/assets/default-config.json
            echo "default-config.json injected ($(wc -c < android/app/src/main/assets/default-config.json) bytes)"
          else
            echo "NO DEFAULT_CONFIG_GZ_B64 secret — app will boot with 0 servers (UI still testable)"
          fi
      - name: Build libbox.aar
        run: bash android/build-libbox.sh "$SING_BOX_TAG"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: UI tour in emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          # The action runs each `script:` line in its own `sh -c`, so all the
          # real logic lives in one bash file where state persists. See ui-tour.sh.
          # tee the whole tour (CDP diag, connect status, per-screen innerText)
          # to an uploaded report so results don't depend on log-grep.
          script: bash ci/ui-tour.sh 2>&1 | tee "$GITHUB_WORKSPACE/android/ui-report.txt"
      - name: Montage screenshots
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/android/shots" || exit 0
          if ls *.png >/dev/null 2>&1; then
            montage $(ls *.png | sort) -tile 4x -geometry 270x+8+8 -background '#0b0b0f' \
              "$GITHUB_WORKSPACE/android/ui-montage.png" || echo "montage failed"
          fi
      - name: Key logcat
        if: always()
        run: |
          F="$GITHUB_WORKSPACE/android/ui-logcat.txt"
          echo "===== razban core/bridge/update ====="
          grep -aE "razban-core|razban-bridge|razban-update|RazbanVpn|CoreStatus" "$F" 2>/dev/null | sed -E 's/^[0-9-]+ [0-9:.]+ +[0-9]+ +[0-9]+ //' | head -120 || echo none
          echo "===== Go panic / native crash ====="
          grep -aE "Go      : panic|Fatal signal|AndroidRuntime.*FATAL|SIGSEGV|SIGABRT" "$F" 2>/dev/null | head -20 || echo none
          echo "===== WebView console ====="
          grep -aiE "chromium.*CONSOLE" "$F" 2>/dev/null | head -40 || echo none
      - name: Assert no fatal JS errors (compat gate)
        if: always()
        run: |
          F="$GITHUB_WORKSPACE/android/ui-logcat.txt"
          # These are the bundle-killing signatures that leave a blank UI on old
          # WebViews (es2020 syntax, missing modern runtime APIs). If any appear,
          # the UI is broken on this API level → fail so the regression is caught.
          # Bundle-killers only (SyntaxError / missing global / ReferenceError +
          # the specific randomUUID regression). NOT the generic "is not a
          # function" — that also matches the benign early-push __razbanDeliver
          # race which the App.tsx status poll recovers from.
          HITS=$(grep -aoiE "Uncaught SyntaxError|Unexpected token|is not defined|ReferenceError|randomUUID is not a function" "$F" 2>/dev/null | sort | uniq -c || true)
          if [ -n "$HITS" ]; then
            echo "::error::Fatal WebView JS errors on API ${{ matrix.api-level }} — UI is broken:"
            echo "$HITS"
            exit 1
          fi
          echo "No fatal WebView JS errors on API ${{ matrix.api-level }} ✓"
      - name: Upload screenshots + montage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-api${{ matrix.api-level }}
          path: |
            android/shots/
            android/ui-montage.png
      - name: Upload logcat + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-logcat-api${{ matrix.api-level }}
          path: |
            android/ui-logcat.txt
            android/ui-report.txt
