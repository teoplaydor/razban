name: android

# Builds the sing-box mobile core (libbox.aar) from the pinned tag, then
# assembles + signs the Razban Android APK. Everything heavy (Go, NDK, the
# Go-core compile) runs on GitHub's runners — nothing is installed locally.
#
# Trigger manually (Actions tab → Run workflow) or by pushing an `android-v*`
# tag. The signed APK is uploaded as an artifact and, for tag builds, attached
# to the matching GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SING_BOX_TAG: v1.13.12
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 28
        run: |
          yes | sdkmanager "ndk;28.0.13004108" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Build libbox.aar
        run: bash android/build-libbox.sh "$SING_BOX_TAG"

      - name: Decode keystore
        id: ks
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/razban.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble release APK
        working-directory: android
        env:
          RAZBAN_KEYSTORE: ${{ steps.ks.outputs.present == 'true' && format('{0}/razban.jks', runner.temp) || '' }}
          RAZBAN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RAZBAN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RAZBAN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.ks.outputs.present }}" = "true" ]; then
            gradle :app:assembleRelease --no-daemon --stacktrace
            echo "APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -1)" >> "$GITHUB_ENV"
          else
            echo "No keystore secret — building a debug-signed APK (installable, not for store)."
            gradle :app:assembleDebug --no-daemon --stacktrace
            echo "APK_PATH=$(ls app/build/outputs/apk/debug/*.apk | head -1)" >> "$GITHUB_ENV"
          fi

      - name: Rename APK
        working-directory: android
        run: |
          mkdir -p out
          cp "$APK_PATH" "out/Razban-0.1.0.apk"
          sha256sum "out/Razban-0.1.0.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Razban-apk
          path: android/out/Razban-0.1.0.apk

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/Razban-0.1.0.apk
